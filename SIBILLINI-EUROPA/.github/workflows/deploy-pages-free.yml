name: Deploy Frontend to GitHub Pages (Free)

on:
  push:
    branches:
      - main
    paths:
      - "SIBILLINI-EUROPA/frontend/**"
      - "SIBILLINI-EUROPA/.github/workflows/deploy-pages-free.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SIBILLINI-EUROPA/package-lock.json

      - name: Install dependencies
        working-directory: SIBILLINI-EUROPA
        run: npm ci

      - name: Generate static frontend
        working-directory: SIBILLINI-EUROPA/frontend
        env:
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
        run: npm run generate

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: SIBILLINI-EUROPA/frontend/.output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
