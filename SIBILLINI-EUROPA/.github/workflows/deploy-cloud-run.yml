name: Deploy to Cloud Run

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  REPOSITORY: sibillini-platform

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push images
        working-directory: SIBILLINI-EUROPA
        run: |
          set -e
          TAG=${GITHUB_SHA}
          IMAGE_PREFIX=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}

          docker build -t ${IMAGE_PREFIX}/frontend:${TAG} ./frontend
          docker build -t ${IMAGE_PREFIX}/api-gateway:${TAG} ./backend/api-gateway
          docker build -t ${IMAGE_PREFIX}/auth-service:${TAG} ./backend/auth-service
          docker build -t ${IMAGE_PREFIX}/content-service:${TAG} ./backend/content-service
          docker build -t ${IMAGE_PREFIX}/media-service:${TAG} ./backend/media-service
          docker build -t ${IMAGE_PREFIX}/schedule-service:${TAG} ./backend/schedule-service

          docker push ${IMAGE_PREFIX}/frontend:${TAG}
          docker push ${IMAGE_PREFIX}/api-gateway:${TAG}
          docker push ${IMAGE_PREFIX}/auth-service:${TAG}
          docker push ${IMAGE_PREFIX}/content-service:${TAG}
          docker push ${IMAGE_PREFIX}/media-service:${TAG}
          docker push ${IMAGE_PREFIX}/schedule-service:${TAG}

      - name: Deploy backend services
        working-directory: SIBILLINI-EUROPA
        run: |
          set -e
          TAG=${GITHUB_SHA}
          IMAGE_PREFIX=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}

          gcloud run deploy auth-service \
            --image ${IMAGE_PREFIX}/auth-service:${TAG} \
            --region ${REGION} \
            --platform managed \
            --allow-unauthenticated

          gcloud run deploy content-service \
            --image ${IMAGE_PREFIX}/content-service:${TAG} \
            --region ${REGION} \
            --platform managed \
            --allow-unauthenticated

          gcloud run deploy media-service \
            --image ${IMAGE_PREFIX}/media-service:${TAG} \
            --region ${REGION} \
            --platform managed \
            --allow-unauthenticated

          gcloud run deploy schedule-service \
            --image ${IMAGE_PREFIX}/schedule-service:${TAG} \
            --region ${REGION} \
            --platform managed \
            --allow-unauthenticated

      - name: Resolve backend URLs
        id: urls
        run: |
          AUTH_URL=$(gcloud run services describe auth-service --region ${REGION} --format='value(status.url)')
          CONTENT_URL=$(gcloud run services describe content-service --region ${REGION} --format='value(status.url)')
          MEDIA_URL=$(gcloud run services describe media-service --region ${REGION} --format='value(status.url)')
          SCHEDULE_URL=$(gcloud run services describe schedule-service --region ${REGION} --format='value(status.url)')

          echo "auth_url=${AUTH_URL}" >> $GITHUB_OUTPUT
          echo "content_url=${CONTENT_URL}" >> $GITHUB_OUTPUT
          echo "media_url=${MEDIA_URL}" >> $GITHUB_OUTPUT
          echo "schedule_url=${SCHEDULE_URL}" >> $GITHUB_OUTPUT

      - name: Deploy API gateway
        id: gateway
        working-directory: SIBILLINI-EUROPA
        run: |
          set -e
          TAG=${GITHUB_SHA}
          IMAGE_PREFIX=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}

          gcloud run deploy api-gateway \
            --image ${IMAGE_PREFIX}/api-gateway:${TAG} \
            --region ${REGION} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars AUTH_SERVICE_URL=${{ steps.urls.outputs.auth_url }},CONTENT_SERVICE_URL=${{ steps.urls.outputs.content_url }},MEDIA_SERVICE_URL=${{ steps.urls.outputs.media_url }},SCHEDULE_SERVICE_URL=${{ steps.urls.outputs.schedule_url }}

          GATEWAY_URL=$(gcloud run services describe api-gateway --region ${REGION} --format='value(status.url)')
          echo "gateway_url=${GATEWAY_URL}" >> $GITHUB_OUTPUT

      - name: Deploy frontend
        working-directory: SIBILLINI-EUROPA
        run: |
          set -e
          TAG=${GITHUB_SHA}
          IMAGE_PREFIX=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}

          gcloud run deploy frontend \
            --image ${IMAGE_PREFIX}/frontend:${TAG} \
            --region ${REGION} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars NUXT_PUBLIC_API_BASE=${{ steps.gateway.outputs.gateway_url }}

      - name: Print service URLs
        run: |
          echo "Frontend: $(gcloud run services describe frontend --region ${REGION} --format='value(status.url)')"
          echo "Gateway:  $(gcloud run services describe api-gateway --region ${REGION} --format='value(status.url)')"
