name: Deploy To GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed areas
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            galleries:
              - 'galleries/**'
            gallery-widget:
              - 'src/widget/**'
              - 'vite.widget.config.mjs'
            schedule:
              - 'schedule/**'
            schedule-widget:
              - 'src/schedule/**'
              - 'vite.schedule.config.mjs'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Restore dist cache
        id: dist-cache
        uses: actions/cache@v4
        with:
          path: dist
          key: dist-${{ github.sha }}
          restore-keys: dist-

      - name: Build galleries
        if: steps.changes.outputs.galleries == 'true' || steps.dist-cache.outputs.cache-hit != 'true'
        run: npm run build:galleries

      - name: Build gallery widget
        if: steps.changes.outputs.galleries == 'true' || steps.changes.outputs.gallery-widget == 'true' || steps.dist-cache.outputs.cache-hit != 'true'
        run: npm run build:widget

      - name: Build schedule manifest
        if: steps.changes.outputs.schedule == 'true' || steps.dist-cache.outputs.cache-hit != 'true'
        run: npm run build:schedule

      - name: Build schedule widget
        if: steps.changes.outputs.schedule == 'true' || steps.changes.outputs.schedule-widget == 'true' || steps.dist-cache.outputs.cache-hit != 'true'
        run: npm run build:schedule-widget

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy To GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
